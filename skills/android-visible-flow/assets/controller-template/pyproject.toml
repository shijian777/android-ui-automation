[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "android-visible-flow-controller"
version = "3.0.0"
description = "PC-to-Android visible UI workflow controller template"
requires-python = ">=3.10"
dependencies = [
  "uiautomator2>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
android-visible-flow = "ticketflow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
